bundle:
  name: multi-tenant-onboarding

# ---------------------------------------------------------------------------
# Artifacts — build the Python wheel before deploy
# ---------------------------------------------------------------------------
artifacts:
  onboarding_wheel:
    type: whl
    path: .
    build: "pip wheel . --no-deps -w dist/ -q"
    files:
      - source: dist/multi_tenant_onboarding-*.whl

# ---------------------------------------------------------------------------
# Bundle variables
# ---------------------------------------------------------------------------
variables:
  workspace_host:
    description: "Databricks workspace URL"
    default: https://dbc-c2f9035e-6356.cloud.databricks.com
  catalog:
    description: "Unity Catalog name for this environment"
  env:
    description: "Environment identifier: dev | staging | prod"
  tenant_id:
    description: "Tenant ID to onboard"
    default: "acme-corp"
  sql_warehouse_id:
    description: "SQL warehouse ID used by dbt_task"
  onboarding_queue:
    description: "Message queue / topic name for onboarding events"
  slack_channel_prefix:
    description: "Prefix for Slack channel names"

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-c2f9035e-6356.cloud.databricks.com
      root_path: ~/.bundle/multi-tenant-onboarding/dev
    variables:
      catalog: approvalmax_ai_platform
      env: dev
      onboarding_queue: onboarding-dev
      slack_channel_prefix: "#dev-"
      sql_warehouse_id: 55b9eec3660b38e1

  staging:
    mode: development
    workspace:
      host: ${var.workspace_host}
      root_path: ~/.bundle/multi-tenant-onboarding/staging
    variables:
      catalog: platform_catalog_staging
      env: staging

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: ~/.bundle/multi-tenant-onboarding/prod
    variables:
      catalog: platform_catalog
      env: prod

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  jobs:

    # ------------------------------------------------------------------
    # 1. Onboarding orchestrator — notebook_task runs on default serverless
    # ------------------------------------------------------------------
    onboarding_orchestrator:
      name: "[${var.env}] Onboarding Orchestrator"
      description: "Deterministic state machine that processes tenant onboarding events."
      max_concurrent_runs: 1
      tasks:
        - task_key: run_state_machine
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/onboarding_demo
            base_parameters:
              catalog:   ${var.catalog}
              env:       ${var.env}
              tenant_id: ${var.tenant_id}

    # ------------------------------------------------------------------
    # 2. nova-finance E2E acceptance test — notebook_task, serverless
    # ------------------------------------------------------------------
    nova_finance_e2e:
      name: "[${var.env}] nova-finance E2E Test"
      description: "Runs the full Bronze → Silver → Gold → Dashboard acceptance test for nova-finance."
      tasks:
        - task_key: e2e_test
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/new_tenant_e2e_test
            base_parameters:
              catalog:   ${var.catalog}
              tenant_id: nova-finance

    # ------------------------------------------------------------------
    # 3. dbt Gold layer — dbt_task with SQL warehouse
    # ------------------------------------------------------------------
    dbt_gold_nova_finance:
      name: "[${var.env}] dbt Gold — nova-finance"
      description: "Runs and tests dbt Gold models for nova-finance."
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      environments:
        - environment_key: dbt_env
          spec:
            client: "2"
            dependencies: []
      tasks:
        - task_key: dbt_run
          environment_key: dbt_env
          dbt_task:
            project_directory: dbt/
            commands:
              - "dbt deps"
              - "dbt run  --select gold_nova_finance --target ${var.env}"
              - "dbt test --select gold_nova_finance --target ${var.env}"
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.catalog}
            schema: gold_nova_finance

    # ------------------------------------------------------------------
    # 4. Deviation detector — python wheel task
    # ------------------------------------------------------------------
    deviation_detector:
      name: "[${var.env}] Deviation Detector"
      description: "Agentic schema deviation detection. Outputs draft PRs only."
      environments:
        - environment_key: agent_env
          spec:
            client: "2"
            dependencies:
              - openai>=1.0
              - pyyaml>=6.0
              - jinja2>=3.1
              - /Workspace/Users/engineer.support@crea-dv.com/.bundle/multi-tenant-onboarding/dev/files/dist/multi_tenant_onboarding-0.1.0-py3-none-any.whl
      tasks:
        - task_key: detect_deviations
          environment_key: agent_env
          python_wheel_task:
            package_name: multi_tenant_onboarding
            entry_point: deviation-detector
            parameters:
              - "--env"
              - "${var.env}"
              - "--catalog"
              - "${var.catalog}"
          timeout_seconds: 1800
          max_retries: 1

    # ------------------------------------------------------------------
    # 5. DQ anomaly detector — python wheel task, scheduled
    # ------------------------------------------------------------------
    anomaly_detector:
      name: "[${var.env}] DQ Anomaly Detector"
      description: "Agentic data quality anomaly detection."
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      environments:
        - environment_key: agent_env
          spec:
            client: "2"
            dependencies:
              - openai>=1.0
              - pyyaml>=6.0
              - jinja2>=3.1
              - /Workspace/Users/engineer.support@crea-dv.com/.bundle/multi-tenant-onboarding/dev/files/dist/multi_tenant_onboarding-0.1.0-py3-none-any.whl
      tasks:
        - task_key: detect_anomalies
          environment_key: agent_env
          python_wheel_task:
            package_name: multi_tenant_onboarding
            entry_point: anomaly-detector
            parameters:
              - "--env"
              - "${var.env}"
              - "--catalog"
              - "${var.catalog}"
          timeout_seconds: 3600

    # ------------------------------------------------------------------
    # 6. Changelog summariser — python wheel task, weekly
    # ------------------------------------------------------------------
    changelog_summariser:
      name: "[${var.env}] Changelog Summariser"
      description: "Generates human-readable change summaries for stakeholders."
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      environments:
        - environment_key: agent_env
          spec:
            client: "2"
            dependencies:
              - openai>=1.0
              - pyyaml>=6.0
              - jinja2>=3.1
              - /Workspace/Users/engineer.support@crea-dv.com/.bundle/multi-tenant-onboarding/dev/files/dist/multi_tenant_onboarding-0.1.0-py3-none-any.whl
      tasks:
        - task_key: summarise_changelogs
          environment_key: agent_env
          python_wheel_task:
            package_name: multi_tenant_onboarding
            entry_point: changelog-summariser
            parameters:
              - "--env"
              - "${var.env}"
              - "--catalog"
              - "${var.catalog}"
              - "--lookback-days"
              - "7"
          timeout_seconds: 1800
